# .github/workflows/update-macports-portfile.yml
#
# Polls for new cloudflare-speed-cli releases and opens a PR against your
# macports-ports fork to update the Portfile when a new version is found.
# Also creates a GitHub Release in this repo with a .zip of the Portfile
# in the correct MacPorts directory structure for local testing.
#
# Required repository secrets:
#   MACPORTS_FORK_TOKEN  - a GitHub PAT with `repo` scope on your
#                          macports-ports fork (push branch only).
#                           Requires:
#                             - Contents - Read and write (to push the branch)
#
# Required repository variables (Settings -> Variables -> Actions):
#   MACPORTS_FORK_REPO   - your fork, e.g. "snerpton/macports-ports"
#   PORTFILE_PATH        - path inside the fork, e.g. "net/cloudflare-speed-cli/Portfile"
#
# Companion scripts (must be committed alongside this file):
#   .github/scripts/gen_cargo_crates.py
#   .github/scripts/update_portfile.py

name: Update MacPorts Portfile for cloudflare-speed-cli

on:
  schedule:
    # Run once a day at 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to target (e.g. v1.2.3). Leave blank to use the latest release."
        required: false
        default: ""

jobs:
  update-portfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create tags and GitHub Releases in this repo

    steps:
      # ------------------------------------------------------------------ #
      # 1. Check out this repo so the companion scripts are available       #
      # ------------------------------------------------------------------ #
      - name: Check out cloudflare-speed-cli repo
        uses: actions/checkout@v4
        with:
          path: source-repo

      # ------------------------------------------------------------------ #
      # 2. Fetch the target release (specific tag or latest)               #
      # ------------------------------------------------------------------ #
      - name: Get target cloudflare-speed-cli release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_TAG="${{ github.event.inputs.release_tag }}"

          if [[ -n "$INPUT_TAG" ]]; then
            # Normalise: accept both "v1.2.3" and "1.2.3" from the user
            TAG="${INPUT_TAG#v}"
            TAG="v${TAG}"
            echo "Using specified release tag: $TAG"
            RELEASE_JSON=$(gh api "repos/kavehtehrani/cloudflare-speed-cli/releases/tags/${TAG}")
          else
            echo "No tag specified - fetching latest release"
            RELEASE_JSON=$(gh api repos/kavehtehrani/cloudflare-speed-cli/releases/latest)
          fi

          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name' | sed 's/^v//')
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag: $TAG)"

      # ------------------------------------------------------------------ #
      # 3. Check out your macports-ports fork                               #
      # ------------------------------------------------------------------ #
      - name: Check out macports-ports fork
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MACPORTS_FORK_REPO }}
          token: ${{ secrets.MACPORTS_FORK_TOKEN }}
          fetch-depth: 1
          path: macports-ports

      # ------------------------------------------------------------------ #
      # 4. Compare versions - skip if already up-to-date                   #
      # ------------------------------------------------------------------ #
      - name: Check whether update is needed
        id: check
        run: |
          PORTFILE="macports-ports/${{ vars.PORTFILE_PATH }}"
          CURRENT=$(grep -E '^github\.setup\s' "$PORTFILE" | awk '{print $4}')
          UPSTREAM="${{ steps.upstream.outputs.version }}"
          echo "Portfile version : $CURRENT"
          echo "Upstream version : $UPSTREAM"
          if [[ "$CURRENT" == "$UPSTREAM" ]]; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit early if Portfile is already current
        if: steps.check.outputs.already_current == 'true'
        run: echo "Portfile is already at ${{ steps.upstream.outputs.version }}. Nothing to do."

      # ------------------------------------------------------------------ #
      # 5. Download the source tarball and compute checksums               #
      # ------------------------------------------------------------------ #
      - name: Download source tarball and compute checksums
        if: steps.check.outputs.already_current == 'false'
        id: checksums
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          TAG="${{ steps.upstream.outputs.tag }}"
          TARBALL_URL="https://github.com/kavehtehrani/cloudflare-speed-cli/archive/refs/tags/${TAG}.tar.gz"
          TARBALL="/tmp/cloudflare-speed-cli-${VERSION}.tar.gz"

          echo "Downloading $TARBALL_URL ..."
          curl -fsSL -o "$TARBALL" "$TARBALL_URL"

          SHA256=$(openssl dgst -sha256 -binary "$TARBALL" | xxd -p -c 256)
          RMD160=$(openssl dgst -rmd160 -binary "$TARBALL" | xxd -p -c 256)
          SIZE=$(wc -c < "$TARBALL" | tr -d ' ')

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "rmd160=$RMD160" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"     >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256  RMD160: $RMD160  SIZE: $SIZE"

      # ------------------------------------------------------------------ #
      # 6. Extract source and generate cargo.crates checksums block        #
      # ------------------------------------------------------------------ #
      - name: Install Rust toolchain
        if: steps.check.outputs.already_current == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Generate cargo.crates block from Cargo.lock
        if: steps.check.outputs.already_current == 'false'
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          TARBALL="${{ steps.checksums.outputs.tarball }}"

          tar -xzf "$TARBALL" -C /tmp
          SRC_DIR="/tmp/cloudflare-speed-cli-${VERSION}"

          cd "$SRC_DIR"
          cargo fetch --locked 2>/dev/null || cargo fetch

          python3 "$GITHUB_WORKSPACE/source-repo/.github/scripts/gen_cargo_crates.py" \
            "$SRC_DIR/Cargo.lock"

          echo "cargo.crates block written to /tmp/cargo_crates.txt"
          echo "First 5 lines:"
          head -5 /tmp/cargo_crates.txt

      # ------------------------------------------------------------------ #
      # 7. Rewrite the Portfile                                             #
      # ------------------------------------------------------------------ #
      - name: Update Portfile
        if: steps.check.outputs.already_current == 'false'
        run: |
          python3 "$GITHUB_WORKSPACE/source-repo/.github/scripts/update_portfile.py" \
            "macports-ports/${{ vars.PORTFILE_PATH }}" \
            "${{ steps.upstream.outputs.version }}" \
            "${{ steps.checksums.outputs.sha256 }}" \
            "${{ steps.checksums.outputs.rmd160 }}" \
            "${{ steps.checksums.outputs.size }}"

      # ------------------------------------------------------------------ #
      # 8. Commit and push branch to your fork                             #
      # ------------------------------------------------------------------ #
      - name: Configure git identity
        if: steps.check.outputs.already_current == 'false'
        working-directory: macports-ports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit Portfile changes and push branch
        if: steps.check.outputs.already_current == 'false'
        id: push
        working-directory: macports-ports
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          BRANCH="update-port/cloudflare-speed-cli-${VERSION}"

          git checkout -b "$BRANCH"
          git add "${{ vars.PORTFILE_PATH }}"
          git commit -m "cloudflare-speed-cli: update to ${VERSION}"
          git push --force origin "$BRANCH"

      # ------------------------------------------------------------------ #
      # 9. Build the MacPorts directory structure and zip it up            #
      # ------------------------------------------------------------------ #
      - name: Build MacPorts directory structure zip
        if: steps.check.outputs.already_current == 'false' && steps.push.conclusion == 'success'
        id: artifact
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          PORTFILE_PATH="${{ vars.PORTFILE_PATH }}"

          # Reconstruct the MacPorts category/port directory layout
          # e.g. PORTFILE_PATH = "net/cloudflare-speed-cli/Portfile"
          #      -> stage/net/cloudflare-speed-cli/Portfile
          STAGE_DIR="/tmp/macports-stage"
          PORT_DIR="$STAGE_DIR/$(dirname "$PORTFILE_PATH")"
          mkdir -p "$PORT_DIR"
          cp "macports-ports/$PORTFILE_PATH" "$PORT_DIR/Portfile"

          ZIP_NAME="cloudflare-speed-cli-portfile-${VERSION}.zip"
          cd "$STAGE_DIR"
          zip -r "/tmp/$ZIP_NAME" .

          echo "zip=/tmp/$ZIP_NAME"   >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME"   >> "$GITHUB_OUTPUT"
          echo "Built $ZIP_NAME"

      # ------------------------------------------------------------------ #
      # 10. Create a GitHub Release in this repo and attach the zip        #
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release and upload zip
        if: steps.check.outputs.already_current == 'false' && steps.push.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          ZIP="${{ steps.artifact.outputs.zip }}"
          ZIP_NAME="${{ steps.artifact.outputs.zip_name }}"
          RELEASE_TAG="cloudflare-speed-cli-${VERSION}"
          UPSTREAM_TAG="${{ steps.upstream.outputs.tag }}"
          UPSTREAM_URL="https://github.com/kavehtehrani/cloudflare-speed-cli/releases/tag/${UPSTREAM_TAG}"

          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "(${VERSION}) MacPorts Portfile for cloudflare-speed-cli ${VERSION}" \
            --notes "MacPorts Portfile update for [cloudflare-speed-cli ${VERSION}](${UPSTREAM_URL}).

          ## Local testing

          1. Download and unzip \`${ZIP_NAME}\`
          2. Copy the resulting directory tree into your local MacPorts ports tree, or point \`port\` at it directly:
             \`\`\`
             sudo port install /path/to/net/cloudflare-speed-cli/Portfile
             \`\`\`" \
            "$ZIP"
